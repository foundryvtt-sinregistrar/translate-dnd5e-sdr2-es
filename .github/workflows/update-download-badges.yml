name: Update download badges

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update download totals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Calculate download totals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -s 'add')

          v13_downloads=$(jq '[.[] | select(.tag_name | test("^v1\\.[0-9]+\\.[0-9]+$")) | (.tag_name | ltrimstr("v") | split(".") | map(tonumber)) as $version | select($version[1] < 13 or ($version[1] == 13 and $version[2] <= 4)) | .assets[]?.download_count] | add // 0' <<< "$releases")
          v14_downloads=$(jq '[.[] | select(.tag_name | test("^v1\\.[0-9]+\\.[0-9]+$")) | (.tag_name | ltrimstr("v") | split(".") | map(tonumber)) as $version | select($version[1] > 13 or ($version[1] == 13 and $version[2] >= 5)) | .assets[]?.download_count] | add // 0' <<< "$releases")

          jq --arg message "$v13_downloads" '.message = $message' downloads-v13.json > downloads-v13.json.tmp
          mv downloads-v13.json.tmp downloads-v13.json
          jq --arg message "$v14_downloads" '.message = $message' downloads-v14.json > downloads-v14.json.tmp
          mv downloads-v14.json.tmp downloads-v14.json

      - name: Commit updated badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads-v13.json downloads-v14.json
          git diff --cached --quiet || git commit -m "chore: update download badges"
          git push